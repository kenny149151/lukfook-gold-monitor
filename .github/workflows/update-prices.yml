name: Collect prices and publish website
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'

concurrency:
  group: lukfook-website
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test parsers and preservation rules
        run: node --test collector.test.mjs
      - name: Collect dated prices and build website
        id: collect
        continue-on-error: true
        run: node collect-prices.mjs
      - name: Preserve quote history and collection status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lukfook-prices.json sync-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Update price history and collection status"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report collection failure after publishing status
        if: steps.collect.outcome == 'failure'
        run: exit 1
